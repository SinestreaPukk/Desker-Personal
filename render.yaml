# Render Blueprint: web app + background worker + Postgres. New > Blueprint > pick this repo.
databases:
  - name: desker-db
    plan: free

services:
  - type: web
    name: desker-personal
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /
    envVars: &env
      - { key: DATABASE_URL, fromDatabase: { name: desker-db, property: connectionString } }
      - { key: TOKEN_ENCRYPTION_KEY, generateValue: true }
      - { key: APP_URL, sync: false }              # https://<this service>.onrender.com
      - { key: ANTHROPIC_API_KEY, sync: false }
      - { key: LINE_CHANNEL_SECRET, sync: false }
      - { key: LINE_CHANNEL_ACCESS_TOKEN, sync: false }
      - { key: GOOGLE_CLIENT_ID, sync: false }
      - { key: GOOGLE_CLIENT_SECRET, sync: false }
      - { key: MS_CLIENT_ID, sync: false }
      - { key: MS_CLIENT_SECRET, sync: false }
      - { key: SLACK_CLIENT_ID, sync: false }
      - { key: SLACK_CLIENT_SECRET, sync: false }
      - { key: TWILIO_ACCOUNT_SID, sync: false }
      - { key: TWILIO_AUTH_TOKEN, sync: false }
      - { key: TWILIO_FROM, sync: false }

  - type: worker
    name: desker-worker
    runtime: node
    plan: starter   # Render has no free background workers
    buildCommand: npm ci
    startCommand: npm run worker
    envVars: *env
